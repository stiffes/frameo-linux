name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build and smoke-test bundle
        run: bash packaging/flatpak/build.sh
      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Framebridge-x86_64-flatpak
          path: packaging/flatpak/Framebridge-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30
