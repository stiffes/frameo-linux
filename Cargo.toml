[package]
name = "frameo-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Linux CLI and desktop client for Frameo digital photo frames"
license = "GPL-3.0-or-later"
repository = "https://github.com/stiffes/frameo-linux"

[[bin]]
name = "frameo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crypto_box = "0.9.1"
directories = "6"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
